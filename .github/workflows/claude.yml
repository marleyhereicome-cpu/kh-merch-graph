# Issue・コメントに「@claude」と書くと、Claude Code が起動して作業し、ブランチ＋PRを作る。
# 作法は CLAUDE.md の「Issue から起動されたときの作法」に書いてある。
name: Claude Code

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # 本文（またはIssueのタイトル）に @claude が含まれるときだけ動かす。
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Claude が test / validate / eval / coverage / check-urls を実行できるように、依存を入れておく。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          # --allowedTools: Claude が使ってよいコマンド。この範囲（npm の検証スクリプト、git、gh、Web閲覧）に
          # 限っている。デプロイ（worker:deploy / wrangler）は含めていない。
          claude_args: >-
            --model claude-sonnet-5 --max-turns 60
            --allowedTools "Edit,Write,Bash(npm ci),Bash(npm test),Bash(npm run build:data),Bash(npm run validate),Bash(npm run eval),Bash(npm run coverage),Bash(npm run check-urls:*),Bash(npm run sample-rows:*),Bash(npx tsc --noEmit),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git checkout:*),Bash(git switch:*),Bash(git push:*),Bash(gh pr:*),Bash(gh issue:*),WebFetch,WebSearch"
